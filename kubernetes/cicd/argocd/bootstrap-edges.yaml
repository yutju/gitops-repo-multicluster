apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-1-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'http://192.168.72.131/root/gitops-repo.git'
    targetRevision: main
    path: clusters/edge-1/apps
    helm:
      valueFiles: [values.yaml]
  destination:
    server: 'https://kubernetes.default.svc' # 중앙 관리 허브에 배포
    namespace: default
  syncPolicy:
    automated: { prune: true, selfHeal: true }
